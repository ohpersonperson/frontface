name: publish

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: ifs
            dist: pressit
          - dir: metacog
            dist: frontface-metacog
          - dir: flashy
            dist: frontface-flashy
          - dir: memdate
            dist: memdate
          - dir: meminqu
            dist: meminqu
          - dir: probe-forge
            dist: fairit
          - dir: audit
            dist: postmo
          - dir: proofit
            dist: frontface-proofit
    environment: ${{ matrix.dist }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the package
        run: |
          pip install build
          cd ${{ matrix.dir }} && python -m build --outdir ../dist/
          ls ../dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1