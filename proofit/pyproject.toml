[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "proofit"
version = "1.0.0"
description = "Fail-closed linter for locked-down runbooks: ten rules of workflow discipline as code"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ryan Wesley Hitchcock" }]
keywords = ["linter", "runbook", "workflow", "technical-writing", "validation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ohpersonperson/skill-suite"

[project.scripts]
proofit = "proofit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
