[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flashy"
version = "1.0.0"
description = "Persistent execution discipline for long tasks: lock the objective, track milestones, detect drift and artificial stops, verify before done"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ryan Wesley Hitchcock" }]
keywords = ["execution", "task-management", "state-machine", "agents", "workflow"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ohpersonperson/skill-suite"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
